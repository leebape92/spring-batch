# 내 MySQL 로 실행할 때만 사용하는 설정
# 실행: --spring.profiles.active=mysql --job.name=dbOrderChunkJob
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/batch?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  batch:
    jdbc:
      # 최초 실행 시 BATCH_JOB_INSTANCE 등 배치 메타 테이블을 MySQL 에 자동 생성
      initialize-schema: always
